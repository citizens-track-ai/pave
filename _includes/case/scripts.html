<script>
  document.addEventListener('DOMContentLoaded', function () {
    // 1. Tab Swapping Logic
    const tabButtons = document.querySelectorAll('button.tab-btn[data-target]');
    const contentPanels = document.querySelectorAll('.tab-content-panel');

    tabButtons.forEach(button => {
      button.addEventListener('click', function () {
        const targetId = this.getAttribute('data-target');

        // Remove active state from all buttons and panels
        tabButtons.forEach(btn => {
          btn.classList.remove('active');
          btn.setAttribute('aria-selected', 'false');
        });
        contentPanels.forEach(panel => panel.classList.remove('active'));

        // Activate clicked tab
        this.classList.add('active');
        this.setAttribute('aria-selected', 'true');
        const activePanel = document.getElementById(targetId);
        if (activePanel) {
          activePanel.classList.add('active');
        }

        // 2. Leaflet Map Resize Invalidation Fix
        if (targetId === 'tab-who' && window.miniMap) {
          setTimeout(() => {
            window.miniMap.invalidateSize();
            if (window.mapBounds) {
              window.miniMap.fitBounds(window.mapBounds, { padding: [15, 15], maxZoom: 10 });
            }
          }, 100);
        }
      });
    });

    // 3. Mini Map Loader
    var mapMarkers = [
      {% include case/map_markers.js %}
    ];

  const mapContainer = document.getElementById('case-mini-map');
  if (mapContainer && mapMarkers.length > 0) {
    // Initialize Map inside global window scope so tab logic can access it
    window.miniMap = L.map('case-mini-map', {
      zoomControl: true,
      attributionControl: false
    }).setView([20, 0], 2);

    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png?key=cb1_4qtr_1_72e49fe987375b3637f246b7', {
      maxZoom: 20
    }).addTo(window.miniMap);

    window.mapBounds = L.latLngBounds();

    mapMarkers.forEach(function (m) {
      var marker = L.circleMarker([m.lat, m.lng], {
        radius: m.radius,
        fillColor: m.color,
        color: "#ffffff",
        weight: m.weight,
        opacity: 1,
        fillOpacity: 0.85
      }).addTo(window.miniMap);

      marker.bindPopup("<strong style='font-family:Plus Jakarta Sans, sans-serif; font-size:11px;'>" + m.title + "</strong>");
      window.mapBounds.extend([m.lat, m.lng]);
    });

    // Fit bounds after initial setup
    setTimeout(function () {
      window.miniMap.invalidateSize();
      window.miniMap.fitBounds(window.mapBounds, { padding: [15, 15], maxZoom: 10 });
    }, 150);
  } else if (mapContainer) {
    // Hide map container if there are no coordinates to plot
    mapContainer.parentElement.innerHTML = "<div class='locations-summary-card' style='height: 100%; display: flex; align-items: center; justify-content: center; color: #7a9476; font-style: italic;'>No map data available for this case.</div>";
  }


  // 4. Gallery scroll & lightbox
  const galleryTrack = document.getElementById('gallery-track');
  const galleryPrev = document.getElementById('gallery-prev');
  const galleryNext = document.getElementById('gallery-next');

  if (galleryTrack) {
    const scrollAmount = () => galleryTrack.offsetWidth * 0.65;

    if (galleryPrev) galleryPrev.addEventListener('click', () => {
      galleryTrack.scrollBy({ left: -scrollAmount(), behavior: 'smooth' });
    });
    if (galleryNext) galleryNext.addEventListener('click', () => {
      galleryTrack.scrollBy({ left: scrollAmount(), behavior: 'smooth' });
    });

    // Lightbox
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightbox-img');
    const lightboxCaption = document.getElementById('lightbox-caption');
    const lightboxClose = document.getElementById('lightbox-close');

    galleryTrack.querySelectorAll('.gallery-thumb-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        lightboxImg.src = btn.dataset.full;
        lightboxImg.alt = btn.dataset.caption || '';
        lightboxCaption.textContent = btn.dataset.caption || '';
        lightbox.style.display = 'flex';
        document.body.style.overflow = 'hidden';
      });
    });

    if (lightboxClose) lightboxClose.addEventListener('click', closeLightbox);
    if (lightbox) lightbox.addEventListener('click', e => {
      if (e.target === lightbox) closeLightbox();
    });
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') closeLightbox();
    });

    function closeLightbox() {
      lightbox.style.display = 'none';
      document.body.style.overflow = '';
    }
  }

  // 5. Message carousel
  const msgTrack = document.getElementById('msg-track');
  const msgPrev = document.getElementById('msg-prev');
  const msgNext = document.getElementById('msg-next');

  if (msgTrack) {
    const slides = msgTrack.querySelectorAll('.msg-slide');
    let msgIndex = 0;

    function goToMsg(idx) {
      msgIndex = (idx + slides.length) % slides.length;
      msgTrack.style.transform = `translateX(-${msgIndex * 100}%)`;
    }

    if (msgPrev) msgPrev.addEventListener('click', () => goToMsg(msgIndex - 1));
    if (msgNext) msgNext.addEventListener('click', () => goToMsg(msgIndex + 1));
  }

  // 6. Learn More Tab Switcher Logic
  const learnMoreButtons = document.querySelectorAll('.learn-more-btn');
  learnMoreButtons.forEach(btn => {
    btn.addEventListener('click', function () {
      const targetTab = this.getAttribute('data-tab');
      const tabBtn = document.querySelector(`.tab-btn[data-target="${targetTab}"]`);
      if (tabBtn) {
        tabBtn.click();
        const tabButtonsContainer = document.querySelector('.tab-buttons-container');
        if (tabButtonsContainer) {
          tabButtonsContainer.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
      }
    });
  });

  // Tab Switcher Links (e.g. inline links inside paragraph content)
  const tabSwitcherLinks = document.querySelectorAll('.tab-switcher-link');
  tabSwitcherLinks.forEach(link => {
    link.addEventListener('click', function (e) {
      e.preventDefault();
      const targetTab = this.getAttribute('data-tab');
      const tabBtn = document.querySelector(`.tab-btn[data-target="${targetTab}"]`);
      if (tabBtn) {
        tabBtn.click();
        const tabButtonsContainer = document.querySelector('.tab-buttons-container');
        if (tabButtonsContainer) {
          tabButtonsContainer.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
      }
    });
  });

  // 7. Read More Toggle Logic
  const readMoreTriggers = document.querySelectorAll('.read-more-trigger');
  readMoreTriggers.forEach(trigger => {
    trigger.addEventListener('click', function () {
      const container = this.closest('.read-more-container');
      if (container) {
        const expandedDiv = container.querySelector('.read-more-expanded');
        if (expandedDiv) {
          const isHidden = expandedDiv.style.display === 'none';
          if (isHidden) {
            expandedDiv.style.display = 'block';
            this.textContent = 'Read less';
            this.setAttribute('aria-expanded', 'true');
          } else {
            expandedDiv.style.display = 'none';
            this.textContent = 'Read more';
            this.setAttribute('aria-expanded', 'false');
            container.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
          }
        }
      }
    });
  });

  // 9. Edge Navigation & Swipe Gestures
  const allCasesList = [
    {% assign first_item = true %}
    {% for c in site.cases %}
      {% if c.curation-decision == "Do not include" %}{% continue %}{% endif %}
      {% unless first_item %},{% endunless %}
      {% assign first_item = false %}
      {
        slug: "{{ c.slug }}",
        id: "{{ c.airtable_id }}",
        title: "{{ c.title | escape }}",
        type: {% if c.curation-decision == "Featured Full Case" or c.curation-decision == "Featured Case" %}"featured"{% elsif c.curation-decision == "Mapping Entry" or c.curation-decision == "Mapping Entries" %}"mapping"{% else %}"full"{% endif %},
        url: "{{ c.url | relative_url }}"
      }
    {% endfor %}
  ];

  const currentSlug = "{{ page.slug }}";
  const currentId = "{{ page.airtable_id }}";

  // Parse custom cases list from URL query parameter
  const urlParams = new URLSearchParams(window.location.search);
  const customCasesParam = urlParams.get('cases') || urlParams.get('explore');
  let navigationList = [];

  if (customCasesParam) {
    const identifiers = customCasesParam.split(',');
    identifiers.forEach(ind => {
      const trimmed = ind.trim().toLowerCase();
      const matchedCase = allCasesList.find(c => c.slug.toLowerCase() === trimmed || c.id.toLowerCase() === trimmed);
      if (matchedCase && !navigationList.some(item => item.slug === matchedCase.slug)) {
        navigationList.push(matchedCase);
      }
    });
  }

  // If no valid custom cases sequence, build the default list by curation decision type
  if (navigationList.length === 0) {
    const currentCase = allCasesList.find(c => c.slug === currentSlug || c.id === currentId);
    const currentType = currentCase ? currentCase.type : "full";
    navigationList = allCasesList.filter(c => c.type === currentType);
  }

  let currentIndex = navigationList.findIndex(c => c.slug === currentSlug || c.id === currentId);
  if (currentIndex === -1 && navigationList.length > 0) {
    currentIndex = 0;
  }

  // Handle entry animation based on stored transition direction
  const transitionContainer = document.querySelector('.page-nav-transition-container');
  if (transitionContainer) {
    const navDirection = sessionStorage.getItem('navDirection');
    if (navDirection === 'next') {
      transitionContainer.classList.add('nav-anim-enter-next');
      void transitionContainer.offsetWidth; // force reflow
      transitionContainer.classList.remove('nav-anim-enter-next');
      sessionStorage.removeItem('navDirection');
    } else if (navDirection === 'prev') {
      transitionContainer.classList.add('nav-anim-enter-prev');
      void transitionContainer.offsetWidth; // force reflow
      transitionContainer.classList.remove('nav-anim-enter-prev');
      sessionStorage.removeItem('navDirection');
    }
  }

  function navigateToCase(index) {
    if (navigationList.length <= 1) return;
    const targetIndex = (index + navigationList.length) % navigationList.length;
    const targetCase = navigationList[targetIndex];

    const direction = index > currentIndex ? 'next' : 'prev';
    sessionStorage.setItem('navDirection', direction);

    if (transitionContainer) {
      const outClass = direction === 'next' ? 'nav-anim-out-next' : 'nav-anim-out-prev';
      transitionContainer.classList.add(outClass);
      
      setTimeout(() => {
        window.location.href = targetCase.url + window.location.search;
      }, 250);
    } else {
      window.location.href = targetCase.url + window.location.search;
    }
  }

  if (navigationList.length > 1) {
    const prevCase = navigationList[(currentIndex - 1 + navigationList.length) % navigationList.length];
    const nextCase = navigationList[(currentIndex + 1) % navigationList.length];

    // Inject left hover navigation zone
    const leftZone = document.createElement('div');
    leftZone.className = 'edge-nav-zone nav-zone-left';
    leftZone.setAttribute('aria-label', `Previous case: ${prevCase.title}`);
    leftZone.setAttribute('title', `Previous: ${prevCase.title}`);
    leftZone.innerHTML = `
      <div class="edge-nav-btn">
        <svg viewBox="0 0 24 24">
          <path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/>
        </svg>
      </div>
    `;
    leftZone.addEventListener('click', () => navigateToCase(currentIndex - 1));
    document.body.appendChild(leftZone);

    // Inject right hover navigation zone
    const rightZone = document.createElement('div');
    rightZone.className = 'edge-nav-zone nav-zone-right';
    rightZone.setAttribute('aria-label', `Next case: ${nextCase.title}`);
    rightZone.setAttribute('title', `Next: ${nextCase.title}`);
    rightZone.innerHTML = `
      <div class="edge-nav-btn">
        <svg viewBox="0 0 24 24">
          <path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/>
        </svg>
      </div>
    `;
    rightZone.addEventListener('click', () => navigateToCase(currentIndex + 1));
    document.body.appendChild(rightZone);

    // Swipe Gestures Logic
    let touchStartX = 0;
    let touchStartY = 0;
    let touchEndX = 0;
    let touchEndY = 0;

    const minSwipeDistance = 75; // pixels minimum
    const maxVerticalDeviation = 50; // pixels maximum

    document.addEventListener('touchstart', e => {
      // Ignore swipe events on Leaflet Map container and gallery tracks to prevent conflicts
      if (e.target.closest('#case-mini-map') || e.target.closest('#gallery-track') || e.target.closest('.leaflet-container')) {
        touchStartX = 0;
        touchStartY = 0;
        return;
      }
      touchStartX = e.changedTouches[0].screenX;
      touchStartY = e.changedTouches[0].screenY;
    }, { passive: true });

    document.addEventListener('touchend', e => {
      // If start coordinate was reset to 0, ignore the gesture
      if (touchStartX === 0 && touchStartY === 0) return;
      
      touchEndX = e.changedTouches[0].screenX;
      touchEndY = e.changedTouches[0].screenY;
      
      const distanceX = touchEndX - touchStartX;
      const distanceY = touchEndY - touchStartY;

      if (Math.abs(distanceX) > minSwipeDistance && Math.abs(distanceY) < maxVerticalDeviation) {
        if (distanceX > 0) {
          // Swipe Right -> Prev
          navigateToCase(currentIndex - 1);
        } else {
          // Swipe Left -> Next
          navigateToCase(currentIndex + 1);
        }
      }
    }, { passive: true });
  }
  });
</script>
